<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SCNG AOTW Results</title>

  <style>
    :root {
      --accent: #007f86;
      --accent-dark: #005f65;
      --ink: #1f2933;
      --muted: #66737f;
      --line: #d9e0e4;
      --soft: #f4f7f8;
      --white: #ffffff;
      --success: #176b3a;
      --closed: #9b1c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f6f7;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .dashboard {
      max-width: 900px;
      margin: 0 auto;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .topbar {
      height: 6px;
      background: var(--accent);
    }

    .content {
      padding: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .summary-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .summary-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .summary-value {
      display: block;
      font-size: 24px;
      font-weight: 800;
    }

    .status-open {
      color: var(--success);
    }

    .status-closed {
      color: var(--closed);
    }

    .result {
      margin-bottom: 22px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 7px;
    }

    .candidate-name {
      font-size: 18px;
      font-weight: 800;
    }

    .candidate-school {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .numbers {
      flex-shrink: 0;
      text-align: right;
      font-size: 14px;
      font-weight: 800;
    }

    .bar-track {
      width: 100%;
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #e6ebed;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .4s ease;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .refresh-time {
      color: var(--muted);
      font-size: 12px;
    }

    .error {
      padding: 20px;
      color: #9b1c1c;
      font-weight: 700;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 650px) {
      body {
        padding: 0;
      }

      .dashboard {
        border-radius: 0;
      }

      .content {
        padding: 20px 16px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .result-header {
        align-items: flex-start;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="dashboard">

    <div class="topbar"></div>

    <div
      class="loading"
      id="loading"
    >
      Loading results…
    </div>

    <section
      class="content"
      id="content"
      hidden
    >

      <p class="eyebrow">
        Internal Results Dashboard
      </p>

      <h1>
        SCNG High School Athlete of the Week
      </h1>

      <p
        class="subtitle"
        id="pollTitle"
      ></p>


      <section class="summary">

        <div class="summary-card">

          <span class="summary-label">
            Total votes
          </span>

          <span
            class="summary-value"
            id="totalVotes"
          >
            0
          </span>

        </div>


        <div class="summary-card">

          <span class="summary-label">
            Voting status
          </span>

          <span
            class="summary-value"
            id="pollStatus"
          >
            —
          </span>

        </div>


        <div class="summary-card">

          <span class="summary-label">
            Closes
          </span>

          <span
            class="summary-value"
            id="closesAt"
            style="font-size:16px;"
          >
            —
          </span>

        </div>

      </section>


      <div id="resultsList"></div>


      <div class="controls">

        <button
          type="button"
          id="refreshButton"
        >
          REFRESH RESULTS
        </button>

        <span
          class="refresh-time"
          id="refreshTime"
        ></span>

      </div>

    </section>

  </main>


  <script>

    const API_BASE =
      "https://scng-aotw-api.jwilliams-641.workers.dev";

    const DEFAULT_POLL_ID =
      "test-2026";

    const pollId =
      new URLSearchParams(
        window.location.search
      ).get("poll") ||
      DEFAULT_POLL_ID;


    const loading =
      document.getElementById(
        "loading"
      );

    const content =
      document.getElementById(
        "content"
      );

    const pollTitle =
      document.getElementById(
        "pollTitle"
      );

    const totalVotes =
      document.getElementById(
        "totalVotes"
      );

    const pollStatus =
      document.getElementById(
        "pollStatus"
      );

    const closesAt =
      document.getElementById(
        "closesAt"
      );

    const resultsList =
      document.getElementById(
        "resultsList"
      );

    const refreshButton =
      document.getElementById(
        "refreshButton"
      );

    const refreshTime =
      document.getElementById(
        "refreshTime"
      );


    function formatDeadline(iso) {

      if (!iso) {
        return "Not set";
      }

      return new Intl.DateTimeFormat(
        "en-US",
        {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          timeZone:
            "America/Los_Angeles",
          timeZoneName:
            "short"
        }
      ).format(
        new Date(iso)
      );
    }


    function renderResults(poll) {

      pollTitle.textContent =
        poll.title;

      totalVotes.textContent =
        poll.totalVotes
          .toLocaleString();


      pollStatus.textContent =
        poll.open
          ? "OPEN"
          : "CLOSED";

      pollStatus.className =
        poll.open
          ? "summary-value status-open"
          : "summary-value status-closed";


      closesAt.textContent =
        formatDeadline(
          poll.closesAt
        );


      resultsList
        .replaceChildren();


      const sortedCandidates =
        [...poll.candidates]
          .sort(
            (a, b) =>
              Number(b.votes) -
              Number(a.votes)
          );


      for (
        const candidate
        of sortedCandidates
      ) {

        const votes =
          Number(
            candidate.votes ||
            0
          );


        const percentage =
          poll.totalVotes
            ? (
                votes /
                poll.totalVotes
              ) * 100
            : 0;


        const result =
          document.createElement(
            "section"
          );

        result.className =
          "result";


        const header =
          document.createElement(
            "div"
          );

        header.className =
          "result-header";


        const identity =
          document.createElement(
            "div"
          );


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "candidate-name";

        name.textContent =
          candidate.name;


        const school =
          document.createElement(
            "div"
          );

        school.className =
          "candidate-school";

        school.textContent =
          candidate.school;


        identity.append(
          name,
          school
        );


        const numbers =
          document.createElement(
            "div"
          );

        numbers.className =
          "numbers";

        numbers.textContent =
          `${votes.toLocaleString()} ${
            votes === 1
              ? "vote"
              : "votes"
          } • ${
            percentage
              .toFixed(1)
              .replace(".0", "")
          }%`;


        header.append(
          identity,
          numbers
        );


        const track =
          document.createElement(
            "div"
          );

        track.className =
          "bar-track";


        const fill =
          document.createElement(
            "div"
          );

        fill.className =
          "bar-fill";

        fill.style.width =
          `${percentage}%`;


        track.appendChild(
          fill
        );


        result.append(
          header,
          track
        );


        resultsList
          .appendChild(
            result
          );
      }


      refreshTime.textContent =
        "Last updated: " +
        new Intl.DateTimeFormat(
          "en-US",
          {
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit"
          }
        ).format(
          new Date()
        );


      loading.hidden =
        true;

      content.hidden =
        false;
    }


    async function loadResults() {

      try {

        const response =
          await fetch(
            `${API_BASE}/api/poll?id=${encodeURIComponent(
              pollId
            )}`,
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Request failed: ${response.status}`
          );
        }


        const poll =
          await response.json();


        renderResults(
          poll
        );

      } catch (error) {

        console.error(
          error
        );

        loading.innerHTML =
          '<div class="error">Unable to load poll results.</div>';
      }
    }


    refreshButton
      .addEventListener(
        "click",
        loadResults
      );


    loadResults();


    // Automatically refresh every 20 seconds
    setInterval(
      loadResults,
      20000
    );

  </script>

</body>

</html>
