<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>High School Athlete of the Week</title>

  <style>

    :root {
      --accent: #007f86;
      --accent-dark: #005f65;
      --ink: #202020;
      --muted: #68747d;
      --line: #d9dfe3;
      --soft: #f5f7f8;
      --white: #ffffff;
      --success: #176b3a;
      --danger: #9b1c1c;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }


    body {
      padding: 8px;
    }


    /*
    ========================================
    POLL CONTAINER
    ========================================
    */

    .poll-shell {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;

      background: var(--white);

      border: 1px solid var(--line);
      border-radius: 10px;

      overflow: hidden;
    }


    .poll-topbar {
      height: 5px;
      background: var(--accent);
    }


    .poll-body {
      padding: 26px;
    }


    /*
    ========================================
    BRANDING
    ========================================
    */

    .publication-name {
      margin: 0 0 7px;

      color: var(--accent-dark);

      font-size: 12px;
      line-height: 1.2;

      font-weight: 800;

      letter-spacing: .08em;

      text-transform: uppercase;
    }


    h1 {
      margin: 0;

      color: var(--ink);

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(27px, 5vw, 38px);
      line-height: 1.08;

      font-weight: 700;
    }


    .dek {
      margin: 11px 0 5px;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.45;
    }


    .deadline {
      margin: 0 0 22px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.4;
    }


    /*
    ========================================
    CANDIDATES
    ========================================
    */

    fieldset {
      margin: 0;
      padding: 0;

      border: 0;
    }


    legend {
      position: absolute;

      width: 1px;
      height: 1px;

      margin: -1px;
      padding: 0;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);

      white-space: nowrap;

      border: 0;
    }


    .candidate-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 11px;
    }


    .candidate {
      position: relative;

      display: block;

      min-height: 116px;

      padding:
        16px
        16px
        16px
        47px;

      background: var(--white);

      border: 1px solid var(--line);
      border-radius: 8px;

      cursor: pointer;

      transition:
        border-color .15s ease,
        background .15s ease,
        transform .15s ease;
    }


    .candidate:hover {
      border-color: var(--accent);

      background: #f8fbfb;
    }


    .candidate.selected {
      padding:
        15px
        15px
        15px
        46px;

      border: 2px solid var(--accent);

      background: #f2f9f9;
    }


    .candidate input {
      position: absolute;

      left: 16px;
      top: 19px;

      width: 18px;
      height: 18px;

      margin: 0;

      accent-color: var(--accent);
    }


    .candidate-name {
      display: block;

      margin-bottom: 4px;

      color: var(--ink);

      font-size: 17px;
      line-height: 1.2;

      font-weight: 800;
    }


    .candidate-school {
      display: block;

      margin-bottom: 8px;

      color: var(--accent-dark);

      font-size: 13px;
      line-height: 1.25;

      font-weight: 700;
    }


    .candidate-performance {
      display: block;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.4;
    }


    /*
    ========================================
    VOTE BUTTON
    ========================================
    */

    .actions {
      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 14px;

      margin-top: 20px;
    }


    .vote-button {
      appearance: none;

      padding: 13px 24px;

      color: var(--white);
      background: var(--accent);

      border: 0;
      border-radius: 5px;

      font-size: 14px;
      line-height: 1;

      font-weight: 800;

      letter-spacing: .02em;

      cursor: pointer;
    }


    .vote-button:hover {
      background: var(--accent-dark);
    }


    .vote-button:disabled {
      opacity: .58;

      cursor: default;
    }


    .vote-count {
      color: var(--muted);

      font-size: 13px;
    }


    /*
    ========================================
    STATUS MESSAGES
    ========================================
    */

    .message {
      min-height: 20px;

      margin-top: 14px;

      font-size: 14px;
      line-height: 1.4;

      font-weight: 700;
    }


    .message.success {
      color: var(--success);
    }


    .message.error {
      color: var(--danger);
    }


    /*
    ========================================
    RESULTS
    ========================================
    */

    .results {
      margin-top: 21px;
      padding-top: 20px;

      border-top: 1px solid var(--line);
    }


    .results-title {
      margin: 0 0 15px;

      color: var(--ink);

      font-size: 17px;

      font-weight: 800;
    }


    .result-row {
      margin-bottom: 16px;
    }


    .result-label {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin-bottom: 6px;

      font-size: 13px;
      line-height: 1.3;

      font-weight: 700;
    }


    .result-name {
      min-width: 0;
    }


    .result-pct {
      flex: 0 0 auto;
    }


    .bar-track {
      height: 11px;

      overflow: hidden;

      background: #e8edef;

      border-radius: 999px;
    }


    .bar-fill {
      width: 0;
      height: 100%;

      background: var(--accent);

      border-radius: inherit;

      transition: width .5s ease;
    }


    /*
    ========================================
    DEMO MESSAGE
    ========================================
    */

    .demo-note {
      margin-top: 16px;

      padding: 11px 13px;

      color: var(--muted);
      background: var(--soft);

      border-radius: 5px;

      font-size: 12px;
      line-height: 1.45;
    }


    /*
    ========================================
    LOADING
    ========================================
    */

    .loading {
      padding: 40px 24px;

      color: var(--muted);

      text-align: center;
    }


    /*
    ========================================
    MOBILE
    ========================================
    */

    @media (max-width: 620px) {

      body {
        padding: 0;
      }


      .poll-shell {
        border-left: 0;
        border-right: 0;

        border-radius: 0;
      }


      .poll-body {
        padding: 21px 17px;
      }


      .candidate-grid {
        grid-template-columns: 1fr;
      }


      .candidate {
        min-height: 105px;
      }


      .vote-button {
        width: 100%;

        padding: 15px 20px;
      }


      .actions {
        display: block;
      }


      .vote-count {
        display: block;

        margin-top: 10px;

        text-align: center;
      }

    }

  </style>

</head>


<body>


  <main
    class="poll-shell"
    id="pollShell"
  >

    <div class="poll-topbar"></div>


    <div
      class="loading"
      id="loading"
    >
      Loading poll…
    </div>


    <section
      class="poll-body"
      id="pollBody"
      hidden
    >


      <!--
      AUTOMATIC PUBLICATION NAME
      -->


      <p
        class="publication-name"
        id="publicationName"
      >
        Southern California News Group
      </p>


      <h1>
        High School Athlete of the Week
      </h1>


      <p
        class="dek"
        id="pollSubtitle"
      >
        Vote for the top high school sports performance of the week.
      </p>


      <p
        class="deadline"
        id="pollDeadline"
      ></p>



      <!--
      CANDIDATES
      -->


      <form id="voteForm">


        <fieldset>


          <legend>
            Choose one athlete
          </legend>


          <div
            class="candidate-grid"
            id="candidateGrid"
          ></div>


        </fieldset>



        <!--
        VOTE BUTTON
        -->


        <div class="actions">


          <button
            class="vote-button"
            id="voteButton"
            type="submit"
          >
            CAST YOUR VOTE
          </button>


          <span
            class="vote-count"
            id="voteCount"
          ></span>


        </div>



        <div
          class="message"
          id="message"
          aria-live="polite"
        ></div>


      </form>



      <!--
      RESULTS
      -->


      <section
        class="results"
        id="results"
        hidden
        aria-live="polite"
      >


        <h2 class="results-title">
          Current results
        </h2>


        <div id="resultsList"></div>


      </section>



      <!--
      REMOVE THIS AFTER WE TURN ON REAL VOTING
      -->


      <div
        class="demo-note"
        id="demoNote"
        hidden
      >

        TEST MODE: Votes are not being permanently
        stored yet.

      </div>


    </section>


  </main>



  <script>


    /*
    ============================================================
    1. SCNG PUBLICATION DETECTION
    ============================================================

    document.referrer identifies the site containing
    the iframe.

    Example:

    https://www.ocregister.com/
                  ↓
    The Orange County Register

    You can also override the publication manually:

    ?site=ocregister.com

    ============================================================
    */


    const PUBLICATIONS = {

      "ocregister.com":
        "The Orange County Register",

      "dailynews.com":
        "LA Daily News",

      "pressenterprise.com":
        "The Press-Enterprise",

      "pe.com":
        "The Press-Enterprise",

      "sbsun.com":
        "The Sun",

      "dailybreeze.com":
        "Daily Breeze",

      "sgvtribune.com":
        "San Gabriel Valley Tribune",

      "presstelegram.com":
        "Press-Telegram",

      "pasadenastarnews.com":
        "Pasadena Star-News",

      "redlandsdailyfacts.com":
        "Redlands Daily Facts",

      "whittierdailynews.com":
        "Whittier Daily News",

      "dailybulletin.com":
        "Inland Valley Daily Bulletin"

    };



    function cleanHostname(hostname) {

      return hostname
        .toLowerCase()
        .replace(/^www\./, "");

    }



    function getPublicationName() {


      /*
      ----------------------------------------
      FIRST:
      Check for a manual URL override.
      ----------------------------------------

      Example:

      ?site=ocregister.com

      */


      const params =
        new URLSearchParams(
          window.location.search
        );


      const manualSite =
        params.get("site");


      if (manualSite) {

        const manualHostname =
          cleanHostname(manualSite);


        if (
          PUBLICATIONS[
            manualHostname
          ]
        ) {

          return PUBLICATIONS[
            manualHostname
          ];

        }

      }



      /*
      ----------------------------------------
      SECOND:
      Detect the parent publication
      automatically from the iframe referrer.
      ----------------------------------------
      */


      if (document.referrer) {

        try {


          const referrerURL =
            new URL(
              document.referrer
            );


          const hostname =
            cleanHostname(
              referrerURL.hostname
            );


          if (
            PUBLICATIONS[
              hostname
            ]
          ) {

            return PUBLICATIONS[
              hostname
            ];

          }


        }

        catch (error) {

          console.warn(
            "Could not read publication referrer.",
            error
          );

        }

      }



      /*
      ----------------------------------------
      FALLBACK
      ----------------------------------------
      */


      return "Southern California News Group";

    }



    /*
    ============================================================
    2. API SETTINGS
    ============================================================

    Leave DEMO_MODE = true for now.

    When we build the database:

    DEMO_MODE = false

    ============================================================
    */


    const API_BASE =
      "https://YOUR-WORKER.workers.dev";


    const DEMO_MODE =
      true;



    /*
    ============================================================
    3. POLL SETTINGS
    ============================================================
    */


    const DEFAULT_POLL_ID =
      "test-2026";


    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const pollId =
      urlParams.get("poll")
      ||
      DEFAULT_POLL_ID;



    /*
    ============================================================
    4. BROWSER VOTER IDENTIFICATION
    ============================================================
    */


    const votedKey =
      `scng-aotw-voted:${pollId}`;


    const voterKey =
      "scng-aotw-voter-id";



    function voterId() {


      let id =
        localStorage.getItem(
          voterKey
        );


      if (!id) {


        id =
          crypto.randomUUID();


        localStorage.setItem(
          voterKey,
          id
        );


      }


      return id;

    }



    /*
    ============================================================
    5. TEST POLL DATA
    ============================================================
    */


    const demoPoll = {


      id:
        "test-2026",


      subtitle:
        "Vote for the top high school sports performance of the week.",


      /*
      Change these later.
      */


      opensAt:
        "2026-08-01T07:00:00Z",


      closesAt:
        "2026-12-31T20:00:00Z",


      open:
        true,


      totalVotes:
        3847,


      candidates: [


        {

          id: 1,

          name:
            "Jane Smith",

          school:
            "Mater Dei",

          classYear:
            "Sr.",

          performance:
            "225 total yards and three touchdowns.",

          votes:
            2193

        },


        {

          id: 2,

          name:
            "John Jones",

          school:
            "Centennial",

          classYear:
            "Jr.",

          performance:
            "12 tackles, three sacks and a forced fumble.",

          votes:
            1654

        }


      ]


    };



    /*
    ============================================================
    6. PAGE ELEMENTS
    ============================================================
    */


    const loading =
      document.getElementById(
        "loading"
      );


    const pollBody =
      document.getElementById(
        "pollBody"
      );


    const publicationName =
      document.getElementById(
        "publicationName"
      );


    const form =
      document.getElementById(
        "voteForm"
      );


    const grid =
      document.getElementById(
        "candidateGrid"
      );


    const button =
      document.getElementById(
        "voteButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const results =
      document.getElementById(
        "results"
      );


    const resultsList =
      document.getElementById(
        "resultsList"
      );


    const voteCount =
      document.getElementById(
        "voteCount"
      );


    const demoNote =
      document.getElementById(
        "demoNote"
      );


    let currentPoll =
      null;



    /*
    ============================================================
    7. PUBLICATION BRANDING
    ============================================================
    */


    publicationName.textContent =
      getPublicationName();



    /*
    ============================================================
    8. DEADLINE FORMAT
    ============================================================
    */


    function formatDeadline(
      iso
    ) {


      if (!iso) {

        return "";

      }


      const date =
        new Date(
          iso
        );


      const formatter =
        new Intl.DateTimeFormat(
          "en-US",
          {

            weekday:
              "long",

            month:
              "short",

            day:
              "numeric",

            hour:
              "numeric",

            minute:
              "2-digit",

            timeZone:
              "America/Los_Angeles",

            timeZoneName:
              "short"

          }
        );


      return (
        "Voting closes "
        +
        formatter.format(date)
        +
        "."
      );

    }



    /*
    ============================================================
    9. RENDER POLL
    ============================================================
    */


    function renderPoll(
      poll
    ) {


      currentPoll =
        poll;


      document
        .getElementById(
          "pollSubtitle"
        )
        .textContent =

          poll.subtitle
          ||
          "Vote for the top high school sports performance of the week.";



      document
        .getElementById(
          "pollDeadline"
        )
        .textContent =

          formatDeadline(
            poll.closesAt
          );



      grid.replaceChildren();



      for (
        const candidate
        of poll.candidates
      ) {


        /*
        Candidate card
        */


        const label =
          document.createElement(
            "label"
          );


        label.className =
          "candidate";



        /*
        Radio button
        */


        const input =
          document.createElement(
            "input"
          );


        input.type =
          "radio";


        input.name =
          "athlete";


        input.value =
          candidate.id;


        input.disabled =
          !poll.open;



        /*
        Selected card styling
        */


        input.addEventListener(
          "change",
          function () {


            document
              .querySelectorAll(
                ".candidate"
              )
              .forEach(
                card => {

                  card.classList.remove(
                    "selected"
                  );

                }
              );


            label.classList.add(
              "selected"
            );


          }
        );



        /*
        Candidate name
        */


        const name =
          document.createElement(
            "span"
          );


        name.className =
          "candidate-name";


        name.textContent =
          candidate.name;



        /*
        School + class
        */


        const school =
          document.createElement(
            "span"
          );


        school.className =
          "candidate-school";


        school.textContent =

          [
            candidate.school,
            candidate.classYear
          ]

          .filter(Boolean)

          .join(" • ");



        /*
        Performance
        */


        const performance =
          document.createElement(
            "span"
          );


        performance.className =
          "candidate-performance";


        performance.textContent =
          candidate.performance
          ||
          "";



        /*
        Assemble candidate card
        */


        label.append(
          input,
          name,
          school,
          performance
        );


        grid.appendChild(
          label
        );


      }



      /*
      Vote count
      */


      voteCount.textContent =

        poll.totalVotes
          .toLocaleString()

        +

        " votes cast";



      /*
      Is voting open?
      */


      button.disabled =
        !poll.open;



      if (!poll.open) {


        button.textContent =
          "VOTING CLOSED";


        message.textContent =
          "Voting for this poll has closed.";


        message.className =
          "message";


        renderResults(
          poll
        );


      }


      else if (
        !DEMO_MODE
        &&
        localStorage.getItem(
          votedKey
        )
        ===
        "1"
      ) {


        button.disabled =
          true;


        button.textContent =
          "VOTE RECORDED";


        message.textContent =
          "Thanks for voting.";


        message.className =
          "message success";


        renderResults(
          poll
        );


      }



      /*
      Demo warning
      */


      if (DEMO_MODE) {

        demoNote.hidden =
          false;

      }



      /*
      Display poll
      */


      loading.hidden =
        true;


      pollBody.hidden =
        false;


    }



    /*
    ============================================================
    10. RESULTS
    ============================================================
    */


    function renderResults(
      poll
    ) {


      resultsList.replaceChildren();


      const total =
        Math.max(
          poll.totalVotes || 0,
          0
        );



      for (
        const candidate
        of poll.candidates
      ) {


        const votes =
          Number(
            candidate.votes
            ||
            0
          );


        const percentage =

          total

          ?

          (
            votes
            /
            total
          )
          *
          100

          :

          0;



        const row =
          document.createElement(
            "div"
          );


        row.className =
          "result-row";



        const label =
          document.createElement(
            "div"
          );


        label.className =
          "result-label";



        const name =
          document.createElement(
            "span"
          );


        name.className =
          "result-name";


        name.textContent =
          `${candidate.name} — ${candidate.school}`;



        const percent =
          document.createElement(
            "span"
          );


        percent.className =
          "result-pct";


        percent.textContent =

          percentage

            .toFixed(1)

            .replace(
              ".0",
              ""
            )

          +

          "%";



        const track =
          document.createElement(
            "div"
          );


        track.className =
          "bar-track";



        const fill =
          document.createElement(
            "div"
          );


        fill.className =
          "bar-fill";


        fill.style.width =
          `${percentage}%`;



        label.append(
          name,
          percent
        );


        track.appendChild(
          fill
        );


        row.append(
          label,
          track
        );


        resultsList.appendChild(
          row
        );


      }



      results.hidden =
        false;


    }



    /*
    ============================================================
    11. LOAD POLL
    ============================================================
    */


    async function fetchPoll() {


      /*
      DEMO VERSION
      */


      if (DEMO_MODE) {


        return structuredClone(
          demoPoll
        );


      }



      /*
      REAL DATABASE VERSION
      */


      const response =
        await fetch(

          `${API_BASE}/api/poll?id=${encodeURIComponent(pollId)}`,

          {

            method:
              "GET",

            headers: {

              "Accept":
                "application/json"

            }

          }

        );



      if (!response.ok) {


        throw new Error(

          `Poll request failed (${response.status})`

        );


      }


      return response.json();


    }



    /*
    ============================================================
    12. SUBMIT VOTE
    ============================================================
    */


    async function submitVote(
      candidateId
    ) {


      /*
      DEMO MODE
      */


      if (DEMO_MODE) {


        const poll =
          structuredClone(
            currentPoll
          );


        const candidate =
          poll.candidates.find(

            candidate =>

              String(
                candidate.id
              )

              ===

              String(
                candidateId
              )

          );



        if (candidate) {

          candidate.votes +=
            1;

        }


        poll.totalVotes +=
          1;


        return {

          ok:
            true,

          poll:
            poll

        };


      }



      /*
      REAL DATABASE MODE
      */


      const response =
        await fetch(

          `${API_BASE}/api/vote`,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json",

              "Accept":
                "application/json"

            },


            body:
              JSON.stringify(
                {

                  pollId:
                    pollId,

                  candidateId:
                    Number(
                      candidateId
                    ),

                  voterId:
                    voterId()

                }
              )

          }

        );



      const payload =
        await response
          .json()
          .catch(
            () => ({})
          );



      /*
      Duplicate vote
      */


      if (
        response.status
        ===
        409

        &&
        payload.poll
      ) {


        return {

          ok:
            false,

          duplicate:
            true,

          poll:
            payload.poll

        };


      }



      if (!response.ok) {


        throw new Error(

          payload.error

          ||

          `Vote failed (${response.status})`

        );


      }


      return payload;


    }



    /*
    ============================================================
    13. VOTE BUTTON
    ============================================================
    */


    form.addEventListener(

      "submit",

      async function (
        event
      ) {


        event.preventDefault();



        const selected =
          form.querySelector(

            'input[name="athlete"]:checked'

          );



        message.textContent =
          "";


        message.className =
          "message";



        /*
        No candidate selected
        */


        if (!selected) {


          message.textContent =

            "Please select an athlete before voting.";


          message.className =

            "message error";


          return;


        }



        /*
        Disable while submitting
        */


        button.disabled =
          true;


        button.textContent =
          "SUBMITTING…";



        try {


          const result =
            await submitVote(
              selected.value
            );


          currentPoll =
            result.poll;



          /*
          Duplicate
          */


          if (
            result.duplicate
          ) {


            if (!DEMO_MODE) {

              localStorage.setItem(

                votedKey,

                "1"

              );

            }


            message.textContent =

              "A vote from this browser has already been recorded.";


          }


          /*
          Successful vote
          */


          else {


            if (!DEMO_MODE) {

              localStorage.setItem(

                votedKey,

                "1"

              );

            }


            message.textContent =

              "Thanks for voting!";


          }



          message.className =

            "message success";



          button.textContent =

            DEMO_MODE

            ?

            "CAST YOUR VOTE"

            :

            "VOTE RECORDED";



          voteCount.textContent =

            currentPoll
              .totalVotes
              .toLocaleString()

            +

            " votes cast";



          if (!DEMO_MODE) {


            form
              .querySelectorAll(
                "input"
              )
              .forEach(

                input =>

                  input.disabled =
                    true

              );


          }



          renderResults(
            currentPoll
          );



          /*
          In demo mode,
          allow another test vote.
          */


          if (DEMO_MODE) {


            button.disabled =
              false;


          }


        }


        catch (error) {


          console.error(
            error
          );


          button.disabled =
            false;


          button.textContent =
            "CAST YOUR VOTE";


          message.textContent =

            "We couldn't record your vote. Please try again.";


          message.className =

            "message error";


        }


      }

    );



    /*
    ============================================================
    14. START APPLICATION
    ============================================================
    */


    (
      async function initializePoll() {


        try {


          const poll =
            await fetchPoll();


          renderPoll(
            poll
          );


        }


        catch (error) {


          console.error(
            error
          );


          loading.textContent =

            "The poll could not be loaded. Please try again later.";


        }


      }
    )();


  </script>


</body>
